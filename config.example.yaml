# 复制为 config.yaml 后使用。敏感的 API Key 请放到环境变量 LLM_API_KEY 中。
sources:
  - name: 中国政府网-国务院重要政策
    url: https://www.gov.cn/zhengce/zuixin.htm
    type: web
  - name: 中国政府网-时政要闻
    url: https://www.gov.cn/xinwen/index.htm
    type: web
  # RSS 示例：将下方 url 换成你实际使用的公开 RSS
  # - name: 示例 RSS
  #   url: https://example.com/feed.xml
  #   type: rss

llm:
  # OpenAI 兼容接口；例如 https://api.openai.com/v1
  base_url: https://api.openai.com/v1
  api_key_env: LLM_API_KEY
  model: gpt-4o-mini
  temperature: 0.2
  max_chars: 12000

filter:
  keywords: [会议, 决定, 通知, 讲话, 发布, 规划, 意见, 报告, 政策]
  max_per_source: 5
  hours_window: 48
  request_interval_seconds: 1.0
  title_similarity_threshold: 0.88

output:
  dir: output
  pushplus_token: ""
  feishu_webhook: ""

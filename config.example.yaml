# 复制为 config.yaml 后使用。敏感的 API Key 请放到环境变量 LLM_API_KEY 中。
sources:
  - name: 中国政府网-国务院要闻
    url: https://www.gov.cn/xinwen/yaowen.htm
    type: web
  - name: 国家统计局-最新发布
    url: https://www.stats.gov.cn/sj/zxfb/
    type: web
  - name: 共产党员网-习近平新时代中国特色社会主义思想
    url: https://www.12371.cn/special/xxzd/
    type: web
  # RSS 示例：将下方 url 换成你实际使用的公开 RSS
  # - name: 示例 RSS
  #   url: https://example.com/feed.xml
  #   type: rss

llm:
  # OpenAI 兼容接口
  base_url: https://api.siliconflow.cn/v1
  api_key_env: LLM_API_KEY
  model: deepseek-ai/DeepSeek-V3.2
  temperature: 0.2
  max_chars: 12000

filter:
  keywords: [会议, 决定, 通知, 讲话, 发布, 规划, 意见, 报告, 政策, 中国式现代化, 共同富裕, 高质量发展, 新发展理念, 全面依法治国, 生态文明, 党的建设, 乡村振兴, 文化强国, 总体国家安全观, 人类命运共同体]
  max_per_source: 5
  max_articles_total: 5
  cards_per_article: 2
  quiz_single_per_article: 1
  quiz_fill_per_article: 1
  hours_window: 48
  request_interval_seconds: 1.0
  title_similarity_threshold: 0.88

output:
  dir: output
  push_max_articles: 5
  pushplus_token: ""
  feishu_webhook: ""
